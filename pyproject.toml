[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indonesia-fire-watch"
version = "0.1.0"
description = "Indonesia satellite fire-detection ingestion and reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "shapely>=2.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
firewatch = "firewatch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/firewatch"]
